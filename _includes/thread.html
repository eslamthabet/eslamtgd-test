<article class="thread-entry"><div class="thread-icon" aria-hidden="true">↗</div><div><div class="thread-meta"><span>{% for cat in site.data.categories %}{% if cat.slug == post.category %}{{ cat.name }}{% endif %}{% endfor %}</span><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%Y-%m-%d' }}</time>{% if post.featured %}<span class="featured-badge">مهم</span>{% endif %}</div><h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2><p>{{ post.description | escape }}</p><small>بواسطة إسلام ثابت · اقرأ الموضوع ↗</small></div></article>
